name: Release Please

on:
  push:
    branches:
      - main
  # Re-run publishing for versions that are already released (for example
  # after a failed npm or PyPI upload). Publish steps skip any version that
  # is already on its registry, so this is safe to repeat.
  workflow_dispatch:
    inputs:
      publish:
        description: "Packages to publish: all, or a comma list of typescript, mcp, openclaw, python, go"
        required: true
        default: all

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm --provenance signs the package with this run's OIDC identity.
      id-token: write
      # Starts engine-release for a new engine tag (see "Build engine binaries").
      actions: write
    steps:
      - name: Resolve release-please token
        id: rp_token
        shell: bash
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          repo_api="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          token_can_access_repo() {
            local token="$1"
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              "${repo_api}")
            [ "${code}" = "200" ]
          }

          if [ -n "$RELEASE_PLEASE_TOKEN" ]; then
            if token_can_access_repo "$RELEASE_PLEASE_TOKEN"; then
              echo "token=$RELEASE_PLEASE_TOKEN" >> "$GITHUB_OUTPUT"
              echo "source=release_please_token" >> "$GITHUB_OUTPUT"
              echo "Using RELEASE_PLEASE_TOKEN."
              exit 0
            fi
            echo "::warning::RELEASE_PLEASE_TOKEN cannot access ${GITHUB_REPOSITORY}. Falling back to GITHUB_TOKEN."
          fi

          if token_can_access_repo "$GITHUB_TOKEN"; then
            echo "token=$GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
            echo "source=github_token" >> "$GITHUB_OUTPUT"
            echo "Using GITHUB_TOKEN."
          else
            echo "::error::Neither RELEASE_PLEASE_TOKEN nor GITHUB_TOKEN can access ${GITHUB_REPOSITORY}. Check PAT repo scope/owner and org SSO authorization."
            exit 1
          fi

      - name: Require PAT for PR creation
        if: ${{ steps.rp_token.outputs.source == 'github_token' }}
        shell: bash
        run: |
          echo "::warning::Release Please is using GITHUB_TOKEN. It can only open release PRs if Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests' is on; otherwise add a RELEASE_PLEASE_TOKEN secret with contents and pull-requests write access."

      - uses: googleapis/release-please-action@v4
        if: ${{ github.event_name == 'push' }}
        id: release
        with:
          token: ${{ steps.rp_token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      # What to publish in this run: anything release-please just released,
      # plus whatever a manual run asked for.
      - name: Decide what to publish
        id: want
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.publish }}
          TS: ${{ steps.release.outputs['sdk/typescript--release_created'] }}
          MCP: ${{ steps.release.outputs['sdk/mcp--release_created'] }}
          OPENCLAW: ${{ steps.release.outputs['sdk/openclaw--release_created'] }}
          PYTHON: ${{ steps.release.outputs['sdk/python--release_created'] }}
          GO: ${{ steps.release.outputs['sdk/go--release_created'] }}
        run: |
          requested() {
            [ "$EVENT" = "workflow_dispatch" ] || return 1
            case ",$(echo "$REQUESTED" | tr -d ' ')," in
              *,all,*|*,"$1",*) return 0 ;;
            esac
            return 1
          }
          any=false; npm=false
          for pkg in typescript mcp openclaw python go; do
            case $pkg in
              typescript) created=$TS ;; mcp) created=$MCP ;; openclaw) created=$OPENCLAW ;;
              python) created=$PYTHON ;; go) created=$GO ;;
            esac
            if [ "$created" = "true" ] || requested "$pkg"; then v=true; any=true; else v=false; fi
            echo "$pkg=$v" >> "$GITHUB_OUTPUT"
            case $pkg in typescript|mcp|openclaw) [ "$v" = true ] && npm=true ;; esac
            echo "$pkg: $v"
          done
          echo "npm=$npm" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"

      # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so
      # engine-release never ran for engine-v0.3.0 and that release shipped
      # with no binaries. workflow_dispatch is the documented exception, so
      # start it here. With RELEASE_PLEASE_TOKEN (a PAT) the tag push already
      # triggers it, and dispatching too would build and publish twice.
      - name: Build engine binaries
        if: ${{ steps.release.outputs['engine--release_created'] && steps.rp_token.outputs.source == 'github_token' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs['engine--tag_name'] }}
        run: |
          gh workflow run engine-release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Started engine-release for $TAG"

      - name: Checkout
        if: ${{ steps.want.outputs.any == 'true' }}
        uses: actions/checkout@v4
        with:
          # Tags, so the Go step can find the release commit.
          fetch-depth: 0

      # ── npm packages: lelu-agent-auth (sdk/typescript) and lelu-mcp (sdk/mcp) ──
      #
      # Trusted publishing first: with a Trusted Publisher configured for this
      # workflow on npmjs.com, npm (11.5.1+) authenticates with this run's
      # OIDC identity (id-token: write above). There is no token to expire,
      # 2FA does not block it, and provenance is attached automatically.
      # NPM_TOKEN is only a fallback, and must be a granular token with
      # "bypass two-factor authentication": a token that needs an
      # authenticator code cannot publish from CI.
      - name: Setup Node.js
        if: ${{ steps.want.outputs.npm == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No registry-url: it writes an .npmrc expecting NODE_AUTH_TOKEN,
          # which gets in the way of trusted publishing.

      - name: Use an npm that supports trusted publishing
        if: ${{ steps.want.outputs.npm == 'true' }}
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Configure npm token fallback
        if: ${{ steps.want.outputs.npm == 'true' }}
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > "$HOME/.npmrc"
            echo "NPM_TOKEN is set; npm uses it only if trusted publishing is not configured."
          else
            echo "No NPM_TOKEN; publishing relies on trusted publishing."
          fi

      # Ask npm, the same way npm publish does, whether it trusts this
      # workflow for each package. A failure here means the Trusted
      # Publisher on npmjs.com is missing or doesn't match, and npm will fall
      # back to NPM_TOKEN, which fails with EOTP if that token needs 2FA.
      - name: Check npm trusted publishing
        if: ${{ steps.want.outputs.npm == 'true' }}
        shell: bash
        env:
          WANT_TS: ${{ steps.want.outputs.typescript }}
          WANT_MCP: ${{ steps.want.outputs.mcp }}
          WANT_OPENCLAW: ${{ steps.want.outputs.openclaw }}
        run: |
          id_token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value // empty')
          if [ -z "$id_token" ]; then
            echo "::warning::Could not get a GitHub OIDC token; trusted publishing can't work in this run."
            exit 0
          fi
          check() {
            code=$(curl -sS -o /tmp/npm-oidc.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $id_token" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$1")
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              echo "$1: trusted publishing OK"
            else
              echo "::warning::$1: npm does not trust this workflow (HTTP $code: $(jq -r '.error // .message // empty' /tmp/npm-oidc.json 2>/dev/null)). On npmjs.com, open $1 > Settings > Trusted Publisher and set GitHub Actions: Lelu-ai / lelu / release-please.yml, no environment."
            fi
          }
          [ "$WANT_TS" = true ] && check lelu-agent-auth
          [ "$WANT_MCP" = true ] && check lelu-mcp
          [ "$WANT_OPENCLAW" = true ] && check lelu-openclaw
          exit 0

      - name: Build and Publish TypeScript SDK
        if: ${{ !cancelled() && steps.want.outputs.typescript == 'true' }}
        working-directory: sdk/typescript
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          # npm refuses to publish a version twice. If this version is already
          # on the registry (e.g. published by hand), skip instead of failing,
          # so the steps below still run.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::$NAME@$VERSION is already on npm; skipping publish."
            exit 0
          fi
          npm ci
          npm run build
          npm publish --access public --provenance

      - name: Build and Publish MCP server
        if: ${{ !cancelled() && steps.want.outputs.mcp == 'true' }}
        working-directory: sdk/mcp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::$NAME@$VERSION is already on npm; skipping publish."
            exit 0
          fi
          npm ci
          npm test
          # prepublishOnly builds and checks server.json matches package.json.
          npm publish --access public --provenance

      - name: Build and Publish OpenClaw plugin
        if: ${{ !cancelled() && steps.want.outputs.openclaw == 'true' }}
        working-directory: sdk/openclaw
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::$NAME@$VERSION is already on npm; skipping publish."
            exit 0
          fi
          npm ci
          # prepublishOnly type-checks, tests and builds.
          npm publish --access public --provenance

      # Publish Python SDK to PyPI
      - name: Setup Python
        if: ${{ !cancelled() && steps.want.outputs.python == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python SDK
        if: ${{ !cancelled() && steps.want.outputs.python == 'true' }}
        working-directory: sdk/python
        run: |
          pip install build twine
          python -m build

      - name: Publish Python SDK to PyPI
        if: ${{ !cancelled() && steps.want.outputs.python == 'true' }}
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::Missing PyPI secret. Set PYPI_API_TOKEN or PYPI_TOKEN in repo secrets."
            exit 1
          fi
          # --skip-existing: a version already on PyPI is not an error on a re-run.
          twine upload --skip-existing dist/*

      # Publish Go SDK. The module github.com/lelu-ai/lelu/sdk/go lives in a
      # subdirectory, so Go only sees tags named sdk/go/vX.Y.Z; release-please
      # creates go-sdk-vX.Y.Z. Add the Go-style tag on the same commit.
      - name: Setup Go
        if: ${{ !cancelled() && steps.want.outputs.go == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod

      - name: Validate Go SDK module
        if: ${{ !cancelled() && steps.want.outputs.go == 'true' }}
        working-directory: sdk/go
        run: |
          go test ./...
          go list -m

      - name: Tag Go SDK for the Go module proxy
        if: ${{ !cancelled() && steps.want.outputs.go == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r '."sdk/go"' .github/release-please-manifest.json)
          RP_TAG="go-sdk-v$VERSION"
          GO_TAG="sdk/go/v$VERSION"
          if git rev-parse -q --verify "refs/tags/$GO_TAG" >/dev/null; then
            echo "$GO_TAG already exists."
          else
            if ! COMMIT=$(git rev-list -n 1 "$RP_TAG" 2>/dev/null); then
              echo "::error::$RP_TAG not found; can't tell which commit $GO_TAG belongs on."
              exit 1
            fi
            git tag "$GO_TAG" "$COMMIT"
            git push origin "refs/tags/$GO_TAG"
            echo "Tagged $GO_TAG on $COMMIT"
          fi
          # Ask the proxy to fetch it now, so go get sees it straight away.
          curl -fsS "https://proxy.golang.org/github.com/lelu-ai/lelu/sdk/go/@v/v$VERSION.info" \
            || echo "::warning::The Go proxy hasn't picked up v$VERSION yet; it will on the next request."
