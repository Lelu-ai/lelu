name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm --provenance signs the package with this run's OIDC identity.
      id-token: write
      # Starts engine-release for a new engine tag (see "Build engine binaries").
      actions: write
    steps:
      - name: Resolve release-please token
        id: rp_token
        shell: bash
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          repo_api="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          token_can_access_repo() {
            local token="$1"
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              "${repo_api}")
            [ "${code}" = "200" ]
          }

          if [ -n "$RELEASE_PLEASE_TOKEN" ]; then
            if token_can_access_repo "$RELEASE_PLEASE_TOKEN"; then
              echo "token=$RELEASE_PLEASE_TOKEN" >> "$GITHUB_OUTPUT"
              echo "source=release_please_token" >> "$GITHUB_OUTPUT"
              echo "Using RELEASE_PLEASE_TOKEN."
              exit 0
            fi
            echo "::warning::RELEASE_PLEASE_TOKEN cannot access ${GITHUB_REPOSITORY}. Falling back to GITHUB_TOKEN."
          fi

          if token_can_access_repo "$GITHUB_TOKEN"; then
            echo "token=$GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
            echo "source=github_token" >> "$GITHUB_OUTPUT"
            echo "Using GITHUB_TOKEN."
          else
            echo "::error::Neither RELEASE_PLEASE_TOKEN nor GITHUB_TOKEN can access ${GITHUB_REPOSITORY}. Check PAT repo scope/owner and org SSO authorization."
            exit 1
          fi

      - name: Require PAT for PR creation
        if: ${{ steps.rp_token.outputs.source == 'github_token' }}
        shell: bash
        run: |
          echo "::warning::Release Please is using GITHUB_TOKEN. It can only open release PRs if Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests' is on; otherwise add a RELEASE_PLEASE_TOKEN secret with contents and pull-requests write access."

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.rp_token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so
      # engine-release never ran for engine-v0.3.0 and that release shipped
      # with no binaries. workflow_dispatch is the documented exception, so
      # start it here. With RELEASE_PLEASE_TOKEN (a PAT) the tag push already
      # triggers it, and dispatching too would build and publish twice.
      - name: Build engine binaries
        if: ${{ steps.release.outputs['engine--release_created'] && steps.rp_token.outputs.source == 'github_token' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs['engine--tag_name'] }}
        run: |
          gh workflow run engine-release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Started engine-release for $TAG"

      - name: Checkout
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v4

      # ── npm packages: lelu-agent-auth (sdk/typescript) and lelu-mcp (sdk/mcp) ──
      #
      # Trusted publishing first: with a Trusted Publisher configured for this
      # workflow on npmjs.com, npm (11.5.1+) authenticates with this run's
      # OIDC identity (id-token: write above). There is no token to expire,
      # 2FA does not block it, and provenance is attached automatically.
      # NPM_TOKEN is only a fallback, and must be a granular token with
      # "bypass two-factor authentication": a token that needs an
      # authenticator code cannot publish from CI.
      - name: Setup Node.js
        if: ${{ steps.release.outputs['sdk/typescript--release_created'] || steps.release.outputs['sdk/mcp--release_created'] || steps.release.outputs['sdk/openclaw--release_created'] }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No registry-url: it writes an .npmrc expecting NODE_AUTH_TOKEN,
          # which gets in the way of trusted publishing.

      - name: Use an npm that supports trusted publishing
        if: ${{ steps.release.outputs['sdk/typescript--release_created'] || steps.release.outputs['sdk/mcp--release_created'] || steps.release.outputs['sdk/openclaw--release_created'] }}
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Configure npm token fallback
        if: ${{ steps.release.outputs['sdk/typescript--release_created'] || steps.release.outputs['sdk/mcp--release_created'] || steps.release.outputs['sdk/openclaw--release_created'] }}
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > "$HOME/.npmrc"
            echo "NPM_TOKEN is set; npm uses it only if trusted publishing is not configured."
          else
            echo "No NPM_TOKEN; publishing relies on trusted publishing."
          fi

      - name: Build and Publish TypeScript SDK
        if: ${{ steps.release.outputs['sdk/typescript--release_created'] }}
        working-directory: sdk/typescript
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          # npm refuses to publish a version twice. If this version is already
          # on the registry (e.g. published by hand), skip instead of failing,
          # so the steps below still run.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::$NAME@$VERSION is already on npm; skipping publish."
            exit 0
          fi
          npm ci
          npm run build
          npm publish --access public --provenance

      - name: Build and Publish MCP server
        if: ${{ steps.release.outputs['sdk/mcp--release_created'] }}
        working-directory: sdk/mcp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::$NAME@$VERSION is already on npm; skipping publish."
            exit 0
          fi
          npm ci
          npm test
          # prepublishOnly builds and checks server.json matches package.json.
          npm publish --access public --provenance

      - name: Build and Publish OpenClaw plugin
        if: ${{ steps.release.outputs['sdk/openclaw--release_created'] }}
        working-directory: sdk/openclaw
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::$NAME@$VERSION is already on npm; skipping publish."
            exit 0
          fi
          npm ci
          # prepublishOnly type-checks, tests and builds.
          npm publish --access public --provenance

      # Publish Python SDK to PyPI
      - name: Setup Python
        if: ${{ steps.release.outputs['sdk/python--release_created'] }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python SDK
        if: ${{ steps.release.outputs['sdk/python--release_created'] }}
        working-directory: sdk/python
        run: |
          pip install build twine
          python -m build

      - name: Publish Python SDK to PyPI
        if: ${{ steps.release.outputs['sdk/python--release_created'] }}
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::Missing PyPI secret. Set PYPI_API_TOKEN or PYPI_TOKEN in repo secrets."
            exit 1
          fi
          twine upload dist/*

      # Publish Go SDK (module release via git tag)
      - name: Setup Go
        if: ${{ steps.release.outputs['sdk/go--release_created'] }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Validate Go SDK module
        if: ${{ steps.release.outputs['sdk/go--release_created'] }}
        working-directory: sdk/go
        run: |
          go mod tidy
          go test ./...
          go list -m

      - name: Go SDK publish note
        if: ${{ steps.release.outputs['sdk/go--release_created'] }}
        run: |
          echo "Go module release created via tag: ${{ steps.release.outputs['sdk/go--tag_name'] }}"
          echo "Consumers can install with: go get github.com/lelu-ai/lelu/sdk/go@latest"
