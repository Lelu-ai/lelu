# OpenSSF Scorecard: checks this repository's supply-chain practices (branch
# protection, pinned dependencies, token permissions, signed releases, ...) and
# publishes the result to api.scorecard.dev, which serves the README badge.
#
# publish_results imposes rules on this file: no top-level env or defaults,
# read-all at the top, and only the actions used below in the job.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "27 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload results to code scanning (Security tab).
      security-events: write
      # Publish results to the OpenSSF API for the badge.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
