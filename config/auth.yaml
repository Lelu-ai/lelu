version: "1.0"

# ─────────────────────────────────────────────────────────────────────────────
# auth.yaml — Auth Permission Engine sample policy
#
# Mount this file at /etc/lelu/auth.yaml inside the engine container, or
# point POLICY_PATH to its location.
# ─────────────────────────────────────────────────────────────────────────────

# ── Cross-cutting rules (checked before any role/scope logic) ────────────────
# Bulk data movement is sensitive regardless of which agent scope requests
# it — a scope's own allow list (e.g. cloud_customer's inherited "*") has no
# way to know a given action is exfiltration-shaped, so it falls through to
# allow. Route these to human_review here instead of trusting every scope to
# independently cover the same verbs. Not an exhaustive taxonomy — a stopgap
# for the obvious cases until scopes define real allowlists.
rules:
  - id: bulk-export-review
    match: "*export*"
    decision: human_review
    reason: "Bulk data export requires human approval"
  - id: bulk-download-review
    match: "*download*"
    decision: human_review
    reason: "Bulk data download requires human approval"
  - id: bulk-dump-review
    match: "*dump*"
    decision: human_review
    reason: "Bulk data dump requires human approval"

# ── Standard RBAC roles (humans) ─────────────────────────────────────────────
roles:
  finance_manager:
    allow:
      - view_invoices
      - approve_refunds
    deny:
      - delete_invoices

  customer_support:
    allow:
      - view_invoices
      - issue_credit
    deny:
      - approve_refunds
      - delete_invoices

  read_only_auditor:
    allow:
      - view_invoices
    deny: []

  # Broad base role for the hosted cloud tier — see cloud_customer below.
  # Its own deny/compute rules narrow this down; this just supplies the
  # inherited "allow" half agent_scopes require.
  cloud_default:
    allow:
      - "*"
    deny: []

# ── Agent scopes (AI agents) ──────────────────────────────────────────────────
agent_scopes:

  invoice_bot:
    inherits: finance_manager

    constraints:
      # Maximum refund an agent may approve without extra checks.
      - max_refund_amount: 50.00

      # Confidence gate thresholds (Confidence-Aware Auth ★)
      #   ≥ 90 %  → full autonomous permission
      #   70–89 % → queue action for human review
      #   50–69 % → downgrade to read-only scope
      #   < 50 %  → hard deny + security alert
      - require_human_approval_if_confidence_below: 0.90
      - downgrade_to_read_only_if_confidence_below: 0.70
      - hard_deny_if_confidence_below: 0.50

    # Compute rules: instead of blocking, redirect the agent to a safe alternative.
    # The engine returns decision="compute" with safe_tool + safe_args.
    compute:
      - action: write_*_prod
        safe_tool: write_file
        safe_args:
          path: /dev/sandbox/{original}
          sandboxed: true
      - action: deploy_*
        safe_tool: deploy
        safe_args:
          environment: staging
          sandboxed: true

    deny:
      - delete_invoices

  support_bot:
    inherits: customer_support

    constraints:
      - require_human_approval_if_confidence_below: 0.85
      - downgrade_to_read_only_if_confidence_below: 0.65
      - hard_deny_if_confidence_below: 0.45

    deny:
      - delete_invoices
      - approve_refunds

  # ── Multi-agent delegation example ──────────────────────────────────────────
  # orchestrator_agent can delegate a constrained sub-scope to research_agent.
  # research_agent receives a child JIT token capped to: [research, read_reports]
  # and capped to 300 s TTL, only when orchestrator's confidence ≥ 85%.
  orchestrator_agent:
    inherits: finance_manager
    constraints:
      - require_human_approval_if_confidence_below: 0.90
      - hard_deny_if_confidence_below: 0.60
    can_delegate:
      - to: research_agent
        scoped_to:
          - research
          - read_reports
        max_ttl_seconds: 300
        require_confidence_above: 0.85
    deny:
      - delete_invoices

  research_agent:
    inherits: read_only_auditor
    constraints:
      - require_human_approval_if_confidence_below: 0.80
      - hard_deny_if_confidence_below: 0.50
    deny:
      - approve_refunds
      - delete_invoices

  # ── Hosted cloud tier ──────────────────────────────────────────────────────
  # All cloud-dashboard customers share this one scope for now — per-tenant
  # policy customization (via the dashboard's lib/policies.ts + the engine's
  # internal/sync control-plane worker) isn't wired up yet. Actions here are
  # arbitrary tool names from customers' own agents, not fixed business
  # actions, so this uses the same wildcard shapes as the MCP starter policy
  # rather than the literal action names the demo scopes above use.
  cloud_customer:
    inherits: cloud_default
    constraints:
      - require_human_approval_if_confidence_below: 0.90
      - downgrade_to_read_only_if_confidence_below: 0.70
      - hard_deny_if_confidence_below: 0.50
    compute:
      - action: write_*_prod
        safe_tool: write_file
        safe_args:
          path: /tmp/lelu-sandbox/{original}
          sandboxed: true
      - action: deploy_*
        safe_tool: deploy
        safe_args:
          environment: staging
          sandboxed: true
    deny:
      - "*delete*"
      - "*drop*"
      - "*wipe*"
      - "*exec*"
      - "*shell*"
