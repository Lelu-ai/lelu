name: lelu

# ─────────────────────────────────────────────────────────────────────────────
# Production Docker Compose - Uses Published Images from Docker Hub
# 
# Usage:
#   docker-compose -f docker-compose.production.yml up -d
#
# All images are published to Docker Hub under the 'leluauth' organization
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Lelu Authorization Engine ──────────────────────────────────────────────────
  engine:
    image: leluauth/lelu-engine:latest
    container_name: lelu-engine
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      LISTEN_ADDR:       ":8080"
      POLICY_PATH:       "/etc/lelu/auth.yaml"
      # redis:// URL form (not bare host:port) so the password is actually
      # sent — ParseRedisAddr hands this straight to go-redis's ParseURL,
      # which parses out the password into redis.Options. Shared by both
      # the JIT token store and the human-review queue. See Nate Howard's
      # review: Redis previously had no auth at all.
      REDIS_ADDR:        "redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD to a real secret before running in production}@redis:6379"
      # APP_ENV must be set for the engine's own fail-closed production guard
      # to fire at all (see isProductionEnv() in main.go) — without it, a
      # missing/default JWT_SIGNING_KEY or API_KEY starts up silently instead
      # of refusing to boot. ${VAR:?...} is the second, independent layer:
      # docker compose itself refuses to start if the operator hasn't set a
      # real key, rather than silently substituting the well-known,
      # public-in-source default. See Nate Howard's review.
      APP_ENV:           "production"
      JWT_SIGNING_KEY:   "${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY to a real secret before running in production}"
      CONTROL_PLANE_URL: "${CONTROL_PLANE_URL:-}"
      CP_HMAC_SECRET:    "${CP_HMAC_SECRET:-}"
      API_KEY:           "${API_KEY}"
      LELU_MODE:         "${LELU_MODE:-enforce}"
      INCIDENT_WEBHOOK_URL: "${INCIDENT_WEBHOOK_URL:-}"
      INCIDENT_WEBHOOK_TIMEOUT_MS: "${INCIDENT_WEBHOOK_TIMEOUT_MS:-2000}"
      INCIDENT_WEBHOOK_SLACK_MODE: "${INCIDENT_WEBHOOK_SLACK_MODE:-}"
      INCIDENT_WEBHOOK_TEAMS_MODE: "${INCIDENT_WEBHOOK_TEAMS_MODE:-}"
      INCIDENT_WEBHOOK_PAGERDUTY_MODE: "${INCIDENT_WEBHOOK_PAGERDUTY_MODE:-}"
      PAGERDUTY_ROUTING_KEY: "${PAGERDUTY_ROUTING_KEY:-}"
      LELU_ENGINE_PUBLIC_URL: "${LELU_ENGINE_PUBLIC_URL:-}"
      # Non-zero. At 0 the limiter is never constructed, and an unbounded
      # caller can outrun the audit writer indefinitely — which is what made
      # silent audit loss reachable by an ordinary API key.
      TENANT_AUTH_RATE_LIMIT: "${TENANT_AUTH_RATE_LIMIT:-6000}"
      TENANT_MINT_RATE_LIMIT: "${TENANT_MINT_RATE_LIMIT:-600}"
      # Human review is only a control when the reviewer is provably not the
      # agent under review. Without this, resolved_by is a self-asserted
      # string and a flagged agent can resolve its own item.
      LELU_REVIEWER_KEYS: "${LELU_REVIEWER_KEYS:-}"
      # Chain continuity across restarts, and the sequence high-water mark.
      LELU_AUDIT_STATE_PATH: "/var/lib/lelu/audit-chain.json"
      # Set true to make the engine apply backpressure rather than drop audit
      # events when the writer is saturated.
      LELU_AUDIT_BLOCK_ON_FULL: "${LELU_AUDIT_BLOCK_ON_FULL:-false}"
      # Publishing OAuth authorization-server metadata tells third-party MCP
      # resource servers to trust tokens this engine signs. Off unless you
      # mean it.
      LELU_ADVERTISE_AUTH_SERVER: "${LELU_ADVERTISE_AUTH_SERVER:-false}"
      # The issuer is published verbatim in the discovery documents. Left
      # unset it used to default to the hosted domain, pointing every
      # self-hosted instance's clients at lelu-ai.com for registration and keys.
      LELU_ISSUER: "${LELU_ISSUER:-${LELU_ENGINE_PUBLIC_URL:-}}"
      FALLBACK_REDIS_MODE: "${FALLBACK_REDIS_MODE:-closed}"
      FALLBACK_CP_MODE: "${FALLBACK_CP_MODE:-closed}"
      RISK_ALLOW_THRESHOLD_LOW: "${RISK_ALLOW_THRESHOLD_LOW:-0.30}"
      RISK_READONLY_THRESHOLD_LOW: "${RISK_READONLY_THRESHOLD_LOW:-0.55}"
      RISK_REVIEW_THRESHOLD_LOW: "${RISK_REVIEW_THRESHOLD_LOW:-0.75}"
      RISK_ALLOW_THRESHOLD_MID: "${RISK_ALLOW_THRESHOLD_MID:-0.15}"
      RISK_READONLY_THRESHOLD_MID: "${RISK_READONLY_THRESHOLD_MID:-0.35}"
      RISK_REVIEW_THRESHOLD_MID: "${RISK_REVIEW_THRESHOLD_MID:-0.55}"
      RISK_ALLOW_THRESHOLD_HIGH: "${RISK_ALLOW_THRESHOLD_HIGH:-0.08}"
      RISK_READONLY_THRESHOLD_HIGH: "${RISK_READONLY_THRESHOLD_HIGH:-0.22}"
      RISK_REVIEW_THRESHOLD_HIGH: "${RISK_REVIEW_THRESHOLD_HIGH:-0.40}"
      RISK_CRITICALITY_MID_MIN: "${RISK_CRITICALITY_MID_MIN:-0.50}"
      RISK_CRITICALITY_HIGH_MIN: "${RISK_CRITICALITY_HIGH_MIN:-0.80}"
      # Least restrictive outcome for actions at or above RISK_CRITICALITY_HIGH_MIN:
      # review (default) | read_only | off. While it is review, RISK_ALLOW_THRESHOLD_HIGH
      # and RISK_READONLY_THRESHOLD_HIGH cannot change any verdict (the engine says so at
      # startup if they are tuned). See https://github.com/Lelu-ai/lelu/issues/54.
      RISK_HIGH_CRITICALITY_FLOOR: "${RISK_HIGH_CRITICALITY_FLOOR:-review}"
    volumes:
      # Policy stays read-only: PUT /v1/policy reports 501 rather than failing
      # at write time. Mount it rw if you want the endpoint live.
      - ./config:/etc/lelu:ro
      # Writable state. Without this the engine cannot persist its RSA signing
      # key (so every restart signs receipts with a fresh, unpublished key that
      # nobody can ever verify), cannot open its database (so the identity
      # registry, JWKS endpoint, vault and analytics never start), and cannot
      # persist the audit chain (so every restart opens a new genesis).
      - engine-data:/var/lib/lelu
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - lelu

  # ── Redis — JIT token store & human-review queue ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lelu-redis
    restart: unless-stopped
    # No host port published — engine and platform reach this over the
    # internal `lelu` network by service name, and that's the only access
    # this needs. Publishing 6380:6379 made Redis reachable from outside the
    # host, on top of having no auth at all. If you need local debug access,
    # use `docker compose exec redis redis-cli` or a docker-compose.override.yml
    # you don't commit, not a port published by default.
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?set REDIS_PASSWORD to a real secret before running in production}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lelu

  # ── PostgreSQL — control plane store ─────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: lelu-postgres
    restart: unless-stopped
    # No host port published — same reasoning as redis above. Only the
    # platform service needs to reach this, over the internal network.
    environment:
      POSTGRES_DB:       lelu
      POSTGRES_USER:     lelu
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lelu"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lelu

  # ── Lelu Control Plane ──────────────────────────────────────────────────────
  platform:
    image: leluauth/lelu-platform:latest
    container_name: lelu-platform
    restart: unless-stopped
    ports:
      - "9091:9090"
    environment:
      LISTEN_ADDR:      ":9090"
      DATABASE_URL:     "postgres://lelu:${POSTGRES_PASSWORD}@postgres:5432/lelu?sslmode=disable"
      PLATFORM_API_KEY: "${PLATFORM_API_KEY}"
      EVIDENCE_SIGNING_KEY: "${EVIDENCE_SIGNING_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lelu

  # ── Trace Explorer UI ──────────────────────────────────────────────────────
  ui:
    image: leluauth/lelu-ui:latest
    container_name: lelu-ui
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      PLATFORM_URL:     "http://platform:9090"
      PLATFORM_API_KEY: "${PLATFORM_API_KEY}"
      LELU_ENGINE_URL:  "http://engine:8080"
      LELU_API_KEY:     "${API_KEY}"
    depends_on:
      platform:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lelu

  # ── Lelu MCP Server ──────────────────────────────────────────────────────────
  mcp:
    image: leluauth/lelu-mcp:latest
    container_name: lelu-mcp
    restart: unless-stopped
    # Bound to loopback, not 0.0.0.0.
    #
    # This container holds the engine's API key and authenticates upstream on
    # the caller's behalf, so anything that can reach this port can act as the
    # engine's credential holder — list tools, authorize actions, and mint
    # real signed agent tokens via lelu_mint_token, with no credential of its
    # own. Published on 0.0.0.0 it was an unauthenticated proxy onto the
    # authenticated engine API, reachable by anyone who could reach the host.
    #
    # MCP_AUTH_TOKEN below is the actual fix; this binding is the second layer
    # so that a deployment which forgets to set it is not immediately exposed
    # to the network. Reach it from other containers by service name over the
    # internal `lelu` network, which does not go through this mapping.
    ports:
      - "127.0.0.1:3003:3001"
    environment:
      MCP_TRANSPORT:       "http"
      MCP_PORT:            "3001"
      LELU_ENGINE_URL:     "http://engine:8080"
      LELU_API_KEY:        "${API_KEY}"
      # Required. The MCP server refuses to start an HTTP/SSE transport
      # without it, because a network-listening MCP server that holds the
      # engine's credential and checks nothing is a credential-free path to
      # every tool it exposes.
      MCP_AUTH_TOKEN:      "${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN to a real secret — the MCP server holds the engine API key and must authenticate its own callers}"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lelu

# ─────────────────────────────────────────────────────────────────────────────
# Volumes & Networks
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  redis-data:
  postgres-data:
  engine-data:

networks:
  lelu:
    driver: bridge
