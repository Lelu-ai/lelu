{{- if .Values.engine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lelu-engine
spec:
  replicas: {{ .Values.engine.replicaCount }}
  selector:
    matchLabels:
      app: lelu-engine
  template:
    metadata:
      labels:
        app: lelu-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: engine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: {{ .Values.engine.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.engine.port }}
          env:
            - name: LISTEN_ADDR
              value: ":{{ .Values.engine.port }}"
            - name: POLICY_PATH
              value: {{ .Values.engine.env.POLICY_PATH | quote }}
            - name: REDIS_ADDR
              value: {{ .Values.engine.env.REDIS_ADDR | quote }}
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: lelu-secrets
                  key: engineJwtSigningKey
            # Without API_KEY the engine refuses every request (it fails closed).
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: lelu-secrets
                  key: engineApiKey
            - name: VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: lelu-secrets
                  key: engineVaultKey
            # name:secret pairs (secret >= 16 chars). Unset means ANY holder of
            # API_KEY can approve human reviews, including the agent itself.
            - name: LELU_REVIEWER_KEYS
              valueFrom:
                secretKeyRef:
                  name: lelu-secrets
                  key: engineReviewerKeys
                  optional: true
            - name: CONTROL_PLANE_URL
              value: {{ .Values.engine.env.CONTROL_PLANE_URL | quote }}
            - name: CP_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: lelu-secrets
                  key: engineCpHmacSecret
            - name: REGO_POLICY_PATH
              value: {{ .Values.engine.env.REGO_POLICY_PATH | quote }}
            - name: REGO_POLICY_QUERY
              value: {{ .Values.engine.env.REGO_POLICY_QUERY | quote }}
            - name: INCIDENT_WEBHOOK_URL
              value: {{ .Values.engine.env.INCIDENT_WEBHOOK_URL | quote }}
            - name: INCIDENT_WEBHOOK_TIMEOUT_MS
              value: {{ .Values.engine.env.INCIDENT_WEBHOOK_TIMEOUT_MS | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.engine.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.engine.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
{{ toYaml .Values.engine.resources | indent 12 }}
          volumeMounts:
            - name: policy
              mountPath: /etc/lelu
            # Signing key, SQLite database and audit-chain state. emptyDir
            # survives container restarts but not pod rescheduling; point this
            # at a PersistentVolumeClaim for durable audit evidence.
            - name: state
              mountPath: /var/lib/lelu
      volumes:
        - name: state
          emptyDir: {}
        - name: policy
          configMap:
            name: lelu-policy
---
apiVersion: v1
kind: Service
metadata:
  name: lelu-engine
spec:
  selector:
    app: lelu-engine
  ports:
    - port: {{ .Values.engine.servicePort }}
      targetPort: {{ .Values.engine.port }}
{{- end }}
