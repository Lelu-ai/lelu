# Cloud Run service spec — lelu-ui (Next.js dashboard)
# __ENGINE_URL__ and __PLATFORM_URL__ are filled in by post-deploy.sh
# after the engine and platform services are deployed.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lelu-ui
  labels:
    app: lelu
    component: ui
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      serviceAccountName: lelu-ui@__PROJECT__.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: __IMAGE__
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: PLATFORM_URL
              value: "__PLATFORM_URL__"
            - name: LELU_ENGINE_URL
              value: "__ENGINE_URL__"
            - name: NEXT_PUBLIC_BASE_URL
              value: "https://lelu-ai.com"
            # Amazon SES (HTTPS API) — sends auth/reset emails. SES_REGION must
            # match the region where lelu-ai.com is verified in SES.
            - name: SES_REGION
              value: "us-east-1"
            - name: PLATFORM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lelu-platform-api-key
                  key: latest
            - name: LELU_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lelu-api-key
                  key: latest
            # Postgres for accounts / api-keys / policies (lib/db.ts).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lelu-database-url
                  key: latest
            # Session JWT signing (lib/auth.ts).
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lelu-jwt-secret
                  key: latest
            # AWS credentials for SES sending (IAM user lelu-ses-sender).
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lelu-aws-access-key-id
                  key: latest
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lelu-aws-secret-access-key
                  key: latest
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
  traffic:
    - percent: 100
      latestRevision: true
